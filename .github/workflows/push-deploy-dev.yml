name: Deploy Dev Branch On Merge

on:
  push:
    branches: [ "dev" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15  # 전체 작업 타임아웃 설정

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # 서버에 통신하기 위한 SSH를 설정합니다.
      - name: Setup SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          timeout: 10m  # SSH 액션 타임아웃 설정
          command_timeout: 10m  # 명령어 실행 타임아웃 설정
          script: |
            set -e  # 에러 발생 시 스크립트 중단
            
            echo "=== Starting deployment process ==="
            
            # 배포 서버에 host 키 확인
            sudo mkdir -p ~/.ssh && chmod 700 ~/.ssh
            sudo ssh-keyscan ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
            
            # 배포 서버에서 DockerHub Login
            echo ${{ secrets.DOCKERHUB_TOKEN }} | sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            
            # 컨테이너 이름에서 포트 번호를 추출
            CURRENT_PORT=$(sudo docker ps --format '{{.Names}}' | grep "runninghi-prod-808[0-1]" | grep -oE '808[0-1]' || echo "8081")
            if [ "$CURRENT_PORT" == "8080" ]; then
              NEW_PORT=8081
            else
              NEW_PORT=8080
            fi
            
            # 타임스탬프를 이용한 컨테이너 이름 생성
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            CONTAINER_NAME="runninghi-prod-${NEW_PORT}-${TIMESTAMP}"
            
            echo "Current running port: $CURRENT_PORT"
            echo "New port will be: $NEW_PORT"
            echo "New container name: $CONTAINER_NAME"
            
            # Pull latest image
            echo "=== Pulling latest Docker image ==="
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/runninghi-prod:latest
            
            # 새로운 컨테이너 실행
            echo "=== Starting new container ==="
            sudo docker run -d \
              --name $CONTAINER_NAME \
              --network host \
              -v /home/ec2-user/logs:/app/logs \
              -e SPRING_PROFILES_ACTIVE=dev \
              -e SERVER_PORT=$NEW_PORT \
              ${{ secrets.DOCKERHUB_USERNAME }}/runninghi-prod:latest
            
            # 새로운 컨테이너 상태 확인 (30초 대기 후 검사)
            echo "=== Waiting for container to start ==="
            sleep 30
            
            # 컨테이너가 실행 중인지 확인
            if ! sudo docker ps | grep -q "$CONTAINER_NAME"; then
              echo "ERROR: New container failed to start!"
              sudo docker logs $CONTAINER_NAME
              exit 1
            fi
            
            # nginx 설정 변경 (새로운 포트로 트래픽 전환)
            echo "=== Updating nginx configuration ==="
            sudo sed -i "s/proxy_pass http:\/\/localhost:[0-9]\+/proxy_pass http:\/\/localhost:$NEW_PORT/" /etc/nginx/nginx.conf
            sudo systemctl restart nginx
            
            # nginx 재시작 확인
            if ! sudo systemctl is-active --quiet nginx; then
              echo "ERROR: nginx failed to restart"
              exit 1
            fi
            
            # 이전 컨테이너 정리
            if [ ! -z "$CURRENT_PORT" ] && [ "$CURRENT_PORT" != "$NEW_PORT" ]; then
              echo "=== Cleaning up old containers on port $CURRENT_PORT ==="
              OLD_CONTAINERS=$(sudo docker ps -a | grep "runninghi-prod-${CURRENT_PORT}" | awk '{print $1}' || true)
              for container in $OLD_CONTAINERS; do
                if [ ! -z "$container" ]; then
                  echo "Stopping and removing container: $container"
                  sudo docker stop $container || true
                  sudo docker rm $container || true
                fi
              done
            fi
            
            echo "=== Deployment completed successfully ==="
