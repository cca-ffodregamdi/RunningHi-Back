name: Deploy Dev Branch On Merge

on:
  push:
    branches: [ "dev" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # 서버에 통신하기 위한 SSH를 설정합니다.
      - name: Setup SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            # 배포 서버에 host 키 확인
            sudo mkdir -p ~/.ssh && chmod 700 ~/.ssh
            sudo ssh-keyscan ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
            
            # 배포 서버에서 DockerHub Login
            echo ${{ secrets.DOCKERHUB_TOKEN }} | sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            
            # 현재 실행 중인 컨테이너 확인
            CURRENT_PORT=$(sudo docker ps --format '{{.Ports}}' | grep -oE '0.0.0.0:([0-9]+)->8080' | cut -d: -f2)
            if [ "$CURRENT_PORT" == "8080" ]; then
              NEW_PORT=8081
            else
              NEW_PORT=8080
            fi
            
            # 타임스탬프를 이용한 컨테이너 이름 생성
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            CONTAINER_NAME="runninghi-prod-${NEW_PORT}-${TIMESTAMP}"
            
            echo "Current running port: $CURRENT_PORT"
            echo "New port will be: $NEW_PORT"
            echo "New container name: $CONTAINER_NAME"
            
            # Pull latest image
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/runninghi-prod:latest
            
            # 새로운 컨테이너 실행
            sudo docker run -d \
            --name $CONTAINER_NAME \
            --network host \
            -v /home/ec2-user/logs:/app/logs \
            -e SPRING_PROFILES_ACTIVE=dev \
            -e SERVER_PORT=$NEW_PORT \
            ${{ secrets.DOCKERHUB_USERNAME }}/runninghi-prod:latest
            
             # 새로운 컨테이너 상태 확인 (30초 대기 후 검사)
             TIMEOUT=300
             INTERVAL=10
             ELAPSED=0
             while [ $ELAPSED -lt $TIMEOUT ]; do
               if curl -s http://localhost:$NEW_PORT | grep -q 'UP'; then
                 echo "New container HEALTHY"
                 break
               fi
               echo "Waiting... ($ELAPSED/$TIMEOUT seconds)"
               sleep $INTERVAL
               ELAPSED=$((ELAPSED + INTERVAL))
             done

             if [ $ELAPSED -ge $TIMEOUT ]; then
               echo "New container failed to become healthy"
               sudo docker logs runninghi-prod-$NEW_PORT
               sudo docker stop runninghi-prod-$NEW_PORT
               sudo docker rm runninghi-prod-$NEW_PORT
               exit 1
             fi
            
            
             # nginx 설정 변경 (새로운 포트로 트래픽 전환)
             sudo sed -i "s/proxy_pass http:\/\/localhost:[0-9]\+/proxy_pass http:\/\/localhost:$NEW_PORT/" /etc/nginx/nginx.conf
             sudo systemctl restart nginx
      

             # 이전 컨테이너 정리
             if [ ! -z "$CURRENT_PORT" ]; then
               echo "Cleaning up old containers on port $CURRENT_PORT"
               OLD_CONTAINERS=$(sudo docker ps -a | grep "runninghi-prod-${CURRENT_PORT}" | awk '{print $1}')
               for container in $OLD_CONTAINERS; do
                 sudo docker stop $container || true
                 sudo docker rm $container || true
               done
            fi
