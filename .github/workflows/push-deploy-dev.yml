name: Deploy Dev Branch On Merge

on:
  push:
    branches: [ "dev" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # 서버에 통신하기 위한 SSH를 설정합니다.
      - name: Setup SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            # 배포 서버에 host 키 확인
            sudo mkdir -p ~/.ssh && chmod 700 ~/.ssh
            sudo ssh-keyscan ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
            
            # 배포 서버에서 DockerHub Login
            echo ${{ secrets.DOCKERHUB_TOKEN }} | sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            
            # 현재 실행 중인 컨테이너 확인
            CURRENT_PORT=$(sudo docker ps --format '{{.Ports}}' | grep -oE '0.0.0.0:([0-9]+)->8080' | cut -d: -f2)
            if [ "$CURRENT_PORT" == "8080" ]; then
              NEW_PORT=8081
            else
              NEW_PORT=8080
            fi
            
            echo "Current running port: $CURRENT_PORT"
            echo "New port will be: $NEW_PORT"
            
            # Pull latest image
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/runninghi-prod:latest
            
            # 새로운 컨테이너 실행
            sudo docker run -d \
            --name runninghi-prod-$NEW_PORT \
            --network host \
            -v /home/ec2-user/logs:/app/logs \
            -e SPRING_PROFILES_ACTIVE=dev \
            ${{ secrets.DOCKERHUB_USERNAME }}/runninghi-prod:latest \
            --server.port=$NEW_PORT
            
             # 새로운 컨테이너 상태 확인 (30초 대기 후 검사)
             sleep 30
             if ! curl -s http://localhost:$NEW_PORT | grep -q 'UP'; then
               echo "New container failed to start!"
               sudo docker logs runninghi-prod-$NEW_PORT
               exit 1
             fi
            
            
             # nginx 설정 변경 (새로운 포트로 트래픽 전환)
             sudo sed -i "s/proxy_pass http:\/\/localhost:[0-9]\+/proxy_pass http:\/\/localhost:$NEW_PORT/" /etc/nginx/nginx.conf
             sudo systemctl restart nginx
      

             # 이전 컨테이너 정리
             if [ ! -z "$CURRENT_PORT" ]; then
               echo "Remove old container on port $CURRENT_PORT"
               sudo docker stop runninghi-prod-$CURRENT_PORT || true
               sudo docker rm runninghi-prod-$CURRENT_PORT || true
             fi
